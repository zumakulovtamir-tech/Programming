<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Змейка-Конструктор</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none; 
        }

        body {
            background: #0f0c29; 
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29); 
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative; 
            width: 95vmin;
            height: 95vmin;
            max-width: 600px;
            max-height: 600px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.25);
            border-radius: 15px;
        }

        canvas {
            background-color: #151525;
            border: 4px solid #00ffcc;
            border-radius: 15px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 35, 0.95); 
            backdrop-filter: blur(12px); 
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 15px;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 5vmin; 
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            text-align: center;
        }

        #start-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
            margin-bottom: 15px;
        }

        input {
            padding: 12px;
            font-size: 3.5vmin;
            border-radius: 10px;
            border: 2px solid #302b63;
            background: #24243e;
            color: white;
            margin-bottom: 10px;
            text-align: center;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            width: 70%;
            max-width: 250px;
            z-index: 2;
        }

        input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        #customDropdown {
            position: absolute;
            top: 45px; 
            width: 70%;
            max-width: 250px;
            background: #24243e;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            list-style: none;
            padding: 0;
            margin: 0;
            display: none; 
            z-index: 20;
            max-height: 120px;
            overflow-y: auto;
        }

        #customDropdown li {
            padding: 10px;
            cursor: pointer;
            font-size: 3.5vmin;
            border-bottom: 1px solid #302b63;
            text-align: center;
        }

        #customDropdown li:active {
            background: #00ffcc;
            color: #0f0c29;
        }

        button#startBtn {
            padding: 12px 40px;
            font-size: 4vmin;
            font-weight: bold;
            background: #00ffcc;
            color: #0f0c29;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.5);
            z-index: 2;
        }
        
        button#startBtn:active {
            background: #00ccaa;
            transform: scale(0.95);
        }

        #leaderboard {
            text-align: left;
            width: 85%;
            max-width: 350px;
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #leaderboard h3 {
            margin-bottom: 5px;
            font-size: 3.5vmin;
            text-align: center;
            color: #ffcc00;
        }

        #scoreList {
            margin: 0;
            font-size: 3vmin;
            line-height: 1.5;
            list-style-type: none; 
            padding-left: 0;
        }

        #scoreList li {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 27, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 15;
        }

        #game-over-screen h2 {
            color: #ff3366;
            font-size: 7vmin;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ff3366;
        }

        #game-over-screen p {
            font-size: 5vmin;
            margin-bottom: 20px;
        }

        #restartBtn {
            padding: 12px 35px;
            font-size: 4.5vmin;
            background: #00ffcc;
            color: #0f0c29;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="menu-screen">
            <h1>🐍 Змейка-Конструктор</h1>
            
            <div id="start-menu">
                <input type="text" id="playerName" placeholder="Твоё имя..." maxlength="10" autocomplete="off">
                <ul id="customDropdown"></ul>
                <button id="startBtn">ИГРАТЬ</button>
            </div>

            <div id="leaderboard">
                <h3>🏆 Топ-5 Игроков:</h3>
                <ol id="scoreList"></ol>
            </div>
        </div>

        <div id="game-over-screen">
            <h2>ИГРА ОКОНЧЕНА</h2>
            <p>Очки: <span id="finalScore">0</span></p>
            <button id="restartBtn">ИГРАТЬ СНОВА</button>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const menuScreen = document.getElementById("menu-screen");
        const playerNameInput = document.getElementById("playerName");
        const startBtn = document.getElementById("startBtn");
        const customDropdown = document.getElementById("customDropdown");
        const scoreList = document.getElementById("scoreList");
        
        const gameOverScreen = document.getElementById("game-over-screen");
        const finalScoreSpan = document.getElementById("finalScore");
        const restartBtn = document.getElementById("restartBtn");

        const box = 30; 
        const canvasSize = 600; 
        const gridSize = 20; 

        const FOOD_TYPES = [
            { shape: "square", color: "#ff3366" },   
            { shape: "circle", color: "#ffcc00" },   
            { shape: "triangle", color: "#00ccff" }, 
            { shape: "diamond", color: "#cc33ff" }   
        ];

        let snake = [];
        let eaten = [];
        let d = "RIGHT"; 
        let food;
        let score = 0;
        let gameInterval;
        let gameState = "menu"; 
        let currentPlayerName = "Игрок";

        // --- УПРАВЛЕНИЕ КЛАВИАТУРОЙ (ДЛЯ КОМПЬЮТЕРА) ---
        document.addEventListener("keydown", function(event) {
            let key = event.key;
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) {
                event.preventDefault();
            }
            if (gameState !== "playing") return; 

            if (key === "ArrowLeft" && d !== "RIGHT") d = "LEFT";
            if (key === "ArrowUp" && d !== "DOWN") d = "UP";
            if (key === "ArrowRight" && d !== "LEFT") d = "RIGHT";
            if (key === "ArrowDown" && d !== "UP") d = "DOWN";
        });

        // --- УПРАВЛЕНИЕ СВАЙПАМИ (ДЛЯ ТЕЛЕФОНА) ---
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault(); 
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault(); 
        }, { passive: false });

        canvas.addEventListener("touchend", (e) => {
            if (gameState !== "playing") return;
            
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0 && d !== "LEFT") d = "RIGHT";  
                    else if (dx < 0 && d !== "RIGHT") d = "LEFT"; 
                } else {
                    if (dy > 0 && d !== "UP") d = "DOWN";   
                    else if (dy < 0 && d !== "DOWN") d = "UP"; 
                }
            }
        }, { passive: false });

        // --- СИСТЕМА РЕКОРДОВ ---
        function loadLeaderboard() {
            scoreList.innerHTML = ""; 
            let records = JSON.parse(localStorage.getItem("snakeHighScores")) || [];
            
            if (records.length === 0) {
                scoreList.innerHTML = "<li style='color: #888; text-align: center; justify-content: center;'>Пока нет рекордов</li>";
                return;
            }

            records.forEach((rec, index) => {
                let li = document.createElement("li");
                let medal = "";
                if (index === 0) { medal = "🥇 "; li.style.color = "#ffd700"; } 
                else if (index === 1) { medal = "🥈 "; li.style.color = "#c0c0c0"; } 
                else if (index === 2) { medal = "🥉 "; li.style.color = "#cd7f32"; } 
                else { medal = "▫️ "; li.style.color = "#aaa"; }

                li.innerText = `${medal}${rec.name} — ${rec.score}`;
                scoreList.appendChild(li);
            });
        }

        function saveScore() {
            let records = JSON.parse(localStorage.getItem("snakeHighScores")) || [];
            records.push({ name: currentPlayerName, score: score });
            records.sort((a, b) => b.score - a.score);
            records = records.slice(0, 5); 
            localStorage.setItem("snakeHighScores", JSON.stringify(records));
            loadLeaderboard();
        }

        // --- ИГРОВАЯ ЛОГИКА ---
        function initGame() {
            snake = [{ x: 10 * box, y: 10 * box }];
            eaten = [{ shape: "square", color: "#00ff00" }];
            d = "RIGHT";
            score = 0;
            gameState = "playing";
            food = generateFood();
            
            menuScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            
            clearInterval(gameInterval); 
            // --- ИЗМЕНЕНИЕ: Скорость стала 220 (было 170) ---
            gameInterval = setInterval(draw, 220); 
        }

        function generateFood() {
            let randomType = FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)];
            return {
                x: Math.floor(Math.random() * gridSize) * box,
                y: Math.floor(Math.random() * gridSize) * box,
                shape: randomType.shape,
                color: randomType.color
            };
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) return true;
            }
            return false;
        }

        function drawShape(x, y, shape, color, isHead, isFood) {
            ctx.save(); 
            ctx.shadowColor = color;
            ctx.shadowBlur = isFood ? 20 : 12; 
            
            let pulse = isFood ? Math.sin(Date.now() / 150) * 3 : 0; 
            let size = box + pulse;
            let offset = (box - size) / 2;

            let gradient = ctx.createLinearGradient(x, y, x + size, y + size);
            gradient.addColorStop(0, color);
            gradient.addColorStop(1, "#ffffff"); 

            ctx.fillStyle = gradient;
            ctx.strokeStyle = isHead ? "#ffffff" : color; 
            ctx.lineWidth = isHead ? 3 : 2; 

            ctx.beginPath(); 
            
            if (shape === "square") {
                let r = 8; 
                ctx.moveTo(x + offset + r, y + offset);
                ctx.lineTo(x + offset + size - r, y + offset);
                ctx.quadraticCurveTo(x + offset + size, y + offset, x + offset + size, y + offset + r);
                ctx.lineTo(x + offset + size, y + offset + size - r);
                ctx.quadraticCurveTo(x + offset + size, y + offset + size, x + offset + size - r, y + offset + size);
                ctx.lineTo(x + offset + r, y + offset + size);
                ctx.quadraticCurveTo(x + offset, y + offset + size, x + offset, y + offset + size - r);
                ctx.lineTo(x + offset, y + offset + r);
                ctx.quadraticCurveTo(x + offset, y + offset, x + offset + r, y + offset);
                ctx.closePath();
                ctx.fill();
                if (isHead) ctx.stroke();
            } 
            else if (shape === "circle") {
                ctx.arc(x + box/2, y + box/2, size/2, 0, Math.PI * 2);
                ctx.fill();
                if (isHead) ctx.stroke();
            } 
            else if (shape === "triangle") {
                ctx.moveTo(x + box/2, y + offset); 
                ctx.lineTo(x + offset + size, y + offset + size); 
                ctx.lineTo(x + offset, y + offset + size); 
                ctx.closePath();
                ctx.fill();
                if (isHead) ctx.stroke();
            } 
            else if (shape === "diamond") {
                ctx.moveTo(x + box/2, y + offset); 
                ctx.lineTo(x + offset + size, y + box/2); 
                ctx.lineTo(x + box/2, y + offset + size); 
                ctx.lineTo(x + offset, y + box/2); 
                ctx.closePath();
                ctx.fill();
                if (isHead) ctx.stroke();
            }
            ctx.restore(); 
        }

        function drawBackground() {
            let bgGradient = ctx.createLinearGradient(0, 0, canvasSize, canvasSize);
            bgGradient.addColorStop(0, "#1e1e2f");
            bgGradient.addColorStop(1, "#0f0c1b");
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvasSize, canvasSize);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvasSize; i += box) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvasSize); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvasSize, i); ctx.stroke();
            }
        }

        function draw() {
            if (gameState !== "playing") return;

            drawBackground(); 

            for (let i = 0; i < snake.length; i++) {
                let isHead = (i === 0); 
                let info = eaten[i];
                drawShape(snake[i].x, snake[i].y, info.shape, info.color, isHead, false);
            }

            drawShape(food.x, food.y, food.shape, food.color, false, true);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d === "LEFT") snakeX -= box;
            if (d === "UP") snakeY -= box;
            if (d === "RIGHT") snakeX += box;
            if (d === "DOWN") snakeY += box;

            if (snakeX < 0) snakeX = canvasSize - box;
            else if (snakeX >= canvasSize) snakeX = 0;
            if (snakeY < 0) snakeY = canvasSize - box;
            else if (snakeY >= canvasSize) snakeY = 0;

            let newHead = { x: snakeX, y: snakeY };

            if (snakeX === food.x && snakeY === food.y) {
                let currentMultiplier = Math.floor((eaten.length - 1) / 10) + 1;
                score += 10 * currentMultiplier;
                eaten.unshift({ shape: food.shape, color: food.color });
                food = generateFood(); 
            } else {
                snake.pop(); 
            }

            if (collision(newHead, snake)) {
                gameState = "gameover";
                clearInterval(gameInterval);
                saveScore(); 
                
                finalScoreSpan.innerText = score;
                gameOverScreen.style.display = "flex";
                return;
            }

            snake.unshift(newHead);

            let displayMultiplier = Math.floor((eaten.length - 1) / 10) + 1;
            ctx.fillStyle = "white";
            ctx.font = "bold 24px Montserrat"; 
            ctx.textAlign = "left";
            ctx.fillText("Очки: " + score, 20, 40);
            
            ctx.fillStyle = "#ffcc00";
            ctx.textAlign = "right";
            ctx.fillText("Бонус: x" + displayMultiplier, canvasSize - 20, 40);
        }

        startBtn.addEventListener("click", () => {
            let name = playerNameInput.value.trim();
            if (name === "") name = "Игрок";
            currentPlayerName = name; 
            
            let allPlayers = JSON.parse(localStorage.getItem("snakePlayers")) || [];
            if (!allPlayers.includes(name)) {
                allPlayers.push(name);
                localStorage.setItem("snakePlayers", JSON.stringify(allPlayers));
            }
            loadPlayersList();
            initGame();
        });

        restartBtn.addEventListener("click", () => {
            initGame();
        });

        function loadPlayersList() {
            customDropdown.innerHTML = ""; 
            let allPlayers = JSON.parse(localStorage.getItem("snakePlayers")) || [];
            allPlayers.forEach(name => {
                let li = document.createElement("li");
                li.innerText = name;
                li.addEventListener("mousedown", (e) => {
                    e.preventDefault(); 
                    playerNameInput.value = name;
                    customDropdown.style.display = "none";
                });
                customDropdown.appendChild(li);
            });
        }

        playerNameInput.addEventListener("focus", () => {
            if (customDropdown.children.length > 0) customDropdown.style.display = "block";
        });
        document.addEventListener("click", (e) => {
            if (e.target !== playerNameInput && e.target !== customDropdown) {
                customDropdown.style.display = "none";
            }
        });

        loadPlayersList();
        loadLeaderboard();
    </script>
</body>
</html>
